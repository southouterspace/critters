<title>Clover the Bunny</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
  /* Layout: full-bleed 3D stage, one floating closet card (left on desktop, bottom sheet on phones). */
  :root {
    --bg: #e4ece2;
    --bg-glow: #f6f8f1;
    --fg: #2f3a2f;
    --muted: #66735f;
    --card: rgba(255, 255, 255, 0.8);
    --line: rgba(47, 58, 47, 0.14);
    --accent: #c4566c;
    --on-accent: #ffffff;
    --ring: #2f3a2f;
    --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
    --font-body: "Nunito", ui-rounded, system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b231d; --bg-glow: #2b3a2e; --fg: #eef3ea; --muted: #a6b4a0;
      --card: rgba(30, 40, 32, 0.82); --line: rgba(238, 243, 234, 0.14);
      --accent: #ec8fa1; --on-accent: #2a1218; --ring: #eef3ea; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b231d; --bg-glow: #2b3a2e; --fg: #eef3ea; --muted: #a6b4a0;
    --card: rgba(30, 40, 32, 0.82); --line: rgba(238, 243, 234, 0.14);
    --accent: #ec8fa1; --on-accent: #2a1218; --ring: #eef3ea; color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 55% 40%, var(--bg-glow), var(--bg) 70%);
    background-color: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  #stage canvas { display: block; outline: none; }

  .card {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    width: min(300px, calc(100vw - 32px));
    max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
    display: grid;
    gap: 16px;
    padding: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.75rem;
    line-height: 1.1;
    text-wrap: balance;
  }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 0.875rem; }
  .group { display: grid; gap: 8px; }
  .label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch {
    width: 30px; height: 30px; padding: 0;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: var(--c);
    cursor: pointer;
    transition: transform 120ms ease;
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch[aria-pressed="true"] { border-color: var(--ring); box-shadow: 0 0 0 2px var(--bg-glow) inset; }

  .closet {
    display: grid;
    gap: 12px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .closet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .closet-head h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; }
  .link {
    font: 700 0.8rem/1 var(--font-body);
    color: var(--accent);
    background: none; border: 0; padding: 4px 0; cursor: pointer;
  }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .tab {
    flex: 1;
    font: 700 0.8rem/1 var(--font-body);
    color: var(--muted);
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding: 8px 2px 9px;
    cursor: pointer;
  }
  .tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: 600 0.85rem/1 var(--font-body);
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 12px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--fg); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  .actions { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    font: 600 0.875rem/1 var(--font-body);
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 12px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--fg); }
  .btn[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg-glow); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 560px) {
    .card {
      top: auto;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      left: max(12px, env(safe-area-inset-left, 0px));
      right: max(12px, env(safe-area-inset-right, 0px));
      width: auto;
      max-height: 50%;
      padding: 14px;
      gap: 12px;
    }
    .sub { display: none; }
    h1 { font-size: 1.3rem; }
  }
</style>

<div id="stage" aria-label="3D bunny figure. Drag to rotate, scroll or pinch to zoom."></div>

<aside class="card">
  <header>
    <h1>Clover the Bunny</h1>
    <p class="sub">Drag to turn her around. Scroll or pinch to zoom.</p>
  </header>

  <div class="group">
    <span class="label">Fur</span>
    <div class="swatches" id="fur"></div>
  </div>

  <section class="closet" aria-labelledby="closet-title">
    <div class="closet-head">
      <h2 id="closet-title">Closet</h2>
      <button class="link" id="surprise" type="button">Surprise me</button>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Clothing type"></div>
    <div class="chips" id="items" role="tabpanel"></div>
    <div class="group">
      <span class="label">Outfit color</span>
      <div class="swatches" id="color"></div>
    </div>
  </section>

  <div class="actions">
    <button class="btn" id="spin" type="button" aria-pressed="true">Spin</button>
    <button class="btn" id="reset" type="button">Reset view</button>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  const FURS = [
    { id: "chocolate", name: "Chocolate", fur: 0x8a5a3b, muzzle: 0xf2e4d2 },
    { id: "caramel",   name: "Caramel",   fur: 0xd8b07e, muzzle: 0xfbf1e2 },
    { id: "snow",      name: "Snow",      fur: 0xf1ede6, muzzle: 0xfffcf6 },
    { id: "grey",      name: "Grey",      fur: 0x9a9893, muzzle: 0xf0eee9 },
  ];
  const COLORS = [
    { id: "rose",   name: "Rose",   color: 0xd9667b },
    { id: "sky",    name: "Sky",    color: 0x6f9bd1 },
    { id: "sage",   name: "Sage",   color: 0x86a568 },
    { id: "plum",   name: "Plum",   color: 0x8c5f98 },
    { id: "butter", name: "Butter", color: 0xeccd6e },
    { id: "denim",  name: "Denim",  color: 0x46618c },
  ];
  const CLOSET = [
    { slot: "outfit", tab: "Outfit", items: [
      { id: "apron", name: "Apron dress" },
      { id: "party", name: "Party dress" },
      { id: "overalls", name: "Overalls" },
      { id: "nightgown", name: "Nightgown" },
      { id: "none", name: "Just fur" },
    ] },
    { slot: "hat", tab: "Hat", items: [
      { id: "none", name: "No hat" },
      { id: "straw", name: "Straw hat" },
      { id: "bow", name: "Ear bow" },
      { id: "flowers", name: "Flower crown" },
      { id: "beret", name: "Beret" },
    ] },
    { slot: "extra", tab: "Extras", items: [
      { id: "none", name: "Nothing" },
      { id: "scarf", name: "Scarf" },
      { id: "bag", name: "Shoulder bag" },
      { id: "glasses", name: "Glasses" },
    ] },
    { slot: "shoes", tab: "Shoes", items: [
      { id: "none", name: "Bare paws" },
      { id: "maryjanes", name: "Mary Janes" },
      { id: "boots", name: "Rain boots" },
    ] },
  ];
  const DEFAULTS = { fur: "chocolate", color: "rose", outfit: "apron", hat: "none", extra: "none", shoes: "none" };
  const STORE_KEY = "clover-closet";
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const PI = Math.PI;

  // ---------- Scene ----------
  const stage = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  const HOME = new THREE.Vector3(2.6, 2.3, 7.2);
  const TARGET = new THREE.Vector3(0, 1.6, 0);
  camera.position.copy(HOME);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.copy(TARGET);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 2.6;
  controls.maxDistance = 11;
  controls.autoRotate = !reduceMotion;
  controls.autoRotateSpeed = 1.6;
  controls.update();

  // Soft studio lighting: warm key with shadows, cool fill, rim from behind.
  scene.add(new THREE.HemisphereLight(0xfff8ee, 0x8a9a80, 0.75));
  const key = new THREE.DirectionalLight(0xfff1df, 1.05);
  key.position.set(3, 6, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.radius = 6;
  Object.assign(key.shadow.camera, { left: -2, right: 2, top: 3.5, bottom: -1, near: 1, far: 15 });
  key.shadow.bias = -0.0005;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xdfe9ff, 0.35);
  fill.position.set(-4, 2, 2);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 0.45);
  rim.position.set(-1, 3, -5);
  scene.add(rim);

  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(4, 64),
    new THREE.ShadowMaterial({ opacity: 0.18 })
  );
  ground.rotation.x = -PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // ---------- Materials ----------
  // Fine noise as a bump map gives the matte, flocked look of the real figures.
  function noiseTexture(repeat) {
    const c = document.createElement("canvas");
    c.width = c.height = 256;
    const g = c.getContext("2d");
    const img = g.createImageData(256, 256);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 110 + Math.random() * 145;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeat, repeat);
    return t;
  }
  const flock = noiseTexture(6);
  const weave = noiseTexture(14);
  const felt = (color, bump = 0.006, map = flock) => new THREE.MeshStandardMaterial({
    color, roughness: 1, metalness: 0, bumpMap: map, bumpScale: bump,
  });
  // Flocked velvet: fully matte with a soft sheen that lights up at grazing angles, like the toys' fuzzy coat.
  const furMats = [];
  const velvet = (color) => {
    const m = new THREE.MeshPhysicalMaterial({
      color, roughness: 1, metalness: 0, bumpMap: flock, bumpScale: 0.005, sheen: new THREE.Color(0x000000),
    });
    furMats.push(m);
    return m;
  };
  const plastic = (color, roughness, extra = {}) =>
    new THREE.MeshStandardMaterial({ color, roughness, metalness: 0, ...extra });

  const mat = {
    fur: velvet(FURS[0].fur),
    muzzle: felt(FURS[0].muzzle),
    earInner: felt(0xf0a9b4),
    nose: plastic(0xe0788c, 0.45),
    mouth: plastic(0x5a3a34, 0.6),
    eye: plastic(0x120c0a, 0.12),
    glint: new THREE.MeshBasicMaterial({ color: 0xffffff }),
    dress: plastic(COLORS[0].color, 0.85, { side: THREE.DoubleSide }),
    apron: plastic(0xf1e9dc, 0.95, { side: THREE.DoubleSide }),
    trim: plastic(0xfbf7f0, 0.9),
    ribbon: plastic(0xc23b4e, 0.55),
    button: plastic(0xf2c94c, 0.35),
    straw: felt(0xe0c07a, 0.02, weave),
    beret: felt(0xb2384a, 0.01),
    leaf: plastic(0x6b9a4b, 0.7),
    petalPink: plastic(0xf4a6c0, 0.7),
    petalWhite: plastic(0xfffaf2, 0.7),
    petalLilac: plastic(0xc7a6f0, 0.7),
    knit: felt(0xdba543, 0.02, weave),
    bag: plastic(0xa8744a, 0.7),
    bagFlap: plastic(0x84532f, 0.7),
    frame: plastic(0x3b2a22, 0.35),
    lens: plastic(0xdff0ff, 0.05, { transparent: true, opacity: 0.22 }),
    patent: plastic(0x7a1f2b, 0.22),
    boot: plastic(0xf2c230, 0.3),
  };
  Object.values(mat).forEach((m) => m.color.convertSRGBToLinear());

  // ---------- Mesh helpers ----------
  const sphere = new THREE.SphereGeometry(1, 48, 32);
  function add(geo, material, parent, [x, y, z] = [0, 0, 0], [rx, ry, rz] = [0, 0, 0], [sx, sy, sz] = [1, 1, 1]) {
    const m = new THREE.Mesh(geo, material);
    m.position.set(x, y, z);
    m.rotation.set(rx, ry, rz);
    m.scale.set(sx, sy, sz);
    m.castShadow = true;
    m.receiveShadow = true;
    parent.add(m);
    return m;
  }
  const blob = (material, pos, scale, parent, rot) => add(sphere, material, parent, pos, rot, scale);
  const torus = (r, tube) => new THREE.TorusGeometry(r, tube, 14, 72);
  const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  const lathe = (profile, ...rest) =>
    new THREE.LatheGeometry(profile.map(([r, y]) => new THREE.Vector2(r, y)), ...rest);

  // ---------- The bunny ----------
  // The figure is sculpted as signed distance fields (blended ellipsoids and tapered limbs),
  // meshed once at load with surface nets, so head, cheeks, snout and limbs flow together like the real toy.
  const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; };
  const smax = (a, b, k) => -smin(-a, -b, k);
  function ell(x, y, z, cx, cy, cz, rx, ry, rz) {
    const px = (x - cx) / rx, py = (y - cy) / ry, pz = (z - cz) / rz;
    const k0 = Math.hypot(px, py, pz);
    const k1 = Math.hypot(px / rx, py / ry, pz / rz);
    return k1 === 0 ? -Math.min(rx, ry, rz) : (k0 * (k0 - 1)) / k1;
  }
  function limb(x, y, z, a, b, r1, r2) {
    const bx = b[0] - a[0], by = b[1] - a[1], bz = b[2] - a[2];
    const px = x - a[0], py = y - a[1], pz = z - a[2];
    const h = Math.min(1, Math.max(0, (px * bx + py * by + pz * bz) / (bx * bx + by * by + bz * bz)));
    return Math.hypot(px - bx * h, py - by * h, pz - bz * h) - (r1 + (r2 - r1) * h);
  }
  // Point into an object's local frame (its matrix relative to the bunny root).
  function localizer(obj) {
    obj.updateMatrix();
    const e = new THREE.Matrix4().copy(obj.matrix).invert().elements;
    return (x, y, z) => [
      e[0] * x + e[4] * y + e[8] * z + e[12],
      e[1] * x + e[5] * y + e[9] * z + e[13],
      e[2] * x + e[6] * y + e[10] * z + e[14],
    ];
  }

  // Naive surface nets over a sampled grid, with one projection step and gradient normals.
  function meshSDF(sdf, [x0, y0, z0], [x1, y1, z1], step) {
    const nx = Math.ceil((x1 - x0) / step) + 1, ny = Math.ceil((y1 - y0) / step) + 1, nz = Math.ceil((z1 - z0) / step) + 1;
    const F = new Float32Array(nx * ny * nz);
    const id = (i, j, k) => i + nx * (j + ny * k);
    for (let k = 0; k < nz; k++) for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++)
      F[id(i, j, k)] = sdf(x0 + i * step, y0 + j * step, z0 + k * step);
    const EDGES = [[0, 1], [2, 3], [4, 5], [6, 7], [0, 2], [1, 3], [4, 6], [5, 7], [0, 4], [1, 5], [2, 6], [3, 7]];
    const cx = nx - 1, cy = ny - 1, cz = nz - 1;
    const cellVert = new Int32Array(cx * cy * cz).fill(-1);
    const cid = (i, j, k) => i + cx * (j + cy * k);
    const pos = [], nrm = [], idx = [];
    const v = new Float32Array(8);
    const e = step * 0.5;
    const grad = (x, y, z) => {
      const gx = sdf(x + e, y, z) - sdf(x - e, y, z), gy = sdf(x, y + e, z) - sdf(x, y - e, z), gz = sdf(x, y, z + e) - sdf(x, y, z - e);
      const l = Math.hypot(gx, gy, gz) || 1;
      return [gx / l, gy / l, gz / l];
    };
    for (let k = 0; k < cz; k++) for (let j = 0; j < cy; j++) for (let i = 0; i < cx; i++) {
      let mask = 0;
      for (let c = 0; c < 8; c++) {
        v[c] = F[id(i + (c & 1), j + ((c >> 1) & 1), k + ((c >> 2) & 1))];
        if (v[c] < 0) mask |= 1 << c;
      }
      if (mask === 0 || mask === 255) continue;
      let sx = 0, sy = 0, sz = 0, n = 0;
      for (const [a, b] of EDGES) {
        if ((v[a] < 0) === (v[b] < 0)) continue;
        const t = v[a] / (v[a] - v[b]);
        sx += (a & 1) + ((b & 1) - (a & 1)) * t;
        sy += ((a >> 1) & 1) + (((b >> 1) & 1) - ((a >> 1) & 1)) * t;
        sz += ((a >> 2) & 1) + (((b >> 2) & 1) - ((a >> 2) & 1)) * t;
        n++;
      }
      let px = x0 + (i + sx / n) * step, py = y0 + (j + sy / n) * step, pz = z0 + (k + sz / n) * step;
      const g = grad(px, py, pz), d = sdf(px, py, pz);
      px -= g[0] * d; py -= g[1] * d; pz -= g[2] * d;
      cellVert[cid(i, j, k)] = pos.length / 3;
      pos.push(px, py, pz);
      nrm.push(...grad(px, py, pz));
    }
    const quad = (a, b, c, d) => {
      if (a < 0 || b < 0 || c < 0 || d < 0) return;
      // Orient by comparing the face normal with the field gradient.
      const P = (q) => [pos[q * 3], pos[q * 3 + 1], pos[q * 3 + 2]];
      const [A, B, C] = [P(a), P(b), P(c)];
      const ux = B[0] - A[0], uy = B[1] - A[1], uz = B[2] - A[2];
      const wx = C[0] - A[0], wy = C[1] - A[1], wz = C[2] - A[2];
      const fx = uy * wz - uz * wy, fy = uz * wx - ux * wz, fz = ux * wy - uy * wx;
      if (fx * nrm[a * 3] + fy * nrm[a * 3 + 1] + fz * nrm[a * 3 + 2] >= 0) idx.push(a, b, c, a, c, d);
      else idx.push(a, c, b, a, d, c);
    };
    for (let k = 0; k < cz; k++) for (let j = 0; j < cy; j++) for (let i = 0; i < cx; i++) {
      const s0 = F[id(i, j, k)] < 0;
      if (j > 0 && k > 0 && s0 !== (F[id(i + 1, j, k)] < 0))
        quad(cellVert[cid(i, j, k)], cellVert[cid(i, j - 1, k)], cellVert[cid(i, j - 1, k - 1)], cellVert[cid(i, j, k - 1)]);
      if (i > 0 && k > 0 && s0 !== (F[id(i, j + 1, k)] < 0))
        quad(cellVert[cid(i, j, k)], cellVert[cid(i - 1, j, k)], cellVert[cid(i - 1, j, k - 1)], cellVert[cid(i, j, k - 1)]);
      if (i > 0 && j > 0 && s0 !== (F[id(i, j, k + 1)] < 0))
        quad(cellVert[cid(i, j, k)], cellVert[cid(i - 1, j, k)], cellVert[cid(i - 1, j - 1, k)], cellVert[cid(i, j - 1, k)]);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute("normal", new THREE.Float32BufferAttribute(nrm, 3));
    const uv = [];
    for (let q = 0; q < pos.length; q += 3) uv.push(pos[q] * 2.2 + pos[q + 2] * 1.3, pos[q + 1] * 2.2 + pos[q + 2] * 0.7);
    geo.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
    geo.setIndex(idx);
    return geo;
  }
  // Find where a field's surface crosses the line (x, y, z) for z in [0, 1] — used to seat eyes, nose and mouth.
  function surfaceZ(sdf, x, y) {
    let lo = 0, hi = 1;
    for (let n = 0; n < 32; n++) { const m = (lo + hi) / 2; if (sdf(x, y, m) < 0) lo = m; else hi = m; }
    return lo;
  }
  const smooth01 = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const furMaterial = () => {
    const m = velvet(0xffffff);
    m.vertexColors = true;
    return m;
  };

  const bunny = new THREE.Group();
  scene.add(bunny);

  // Limb frames. Clothes and shoes attach to these groups, and the sculpt reads them too, so they always line up.
  const feet = [-1, 1].map((s) => {
    const foot = new THREE.Group();
    foot.position.set(s * 0.18, 0, 0.13);
    foot.rotation.y = s * 0.2;
    bunny.add(foot);
    return foot;
  });
  const arms = [-1, 1].map((s) => {
    const arm = new THREE.Group();
    arm.position.set(s * 0.29, 1.24, 0.02);
    arm.rotation.set(-0.15, 0, s * 0.42);
    bunny.add(arm);
    return arm;
  });

  // Body: pear-shaped torso with a forward belly, tapered arms with mitten paws, short legs, long feet.
  {
    const footLocal = feet.map(localizer);
    const armLocal = arms.map(localizer);
    const bodySDF = (x, y, z) => {
      const ax = Math.abs(x);
      let d = ell(x, y, z, 0, 0.92, 0, 0.35, 0.47, 0.31);
      d = smin(d, ell(x, y, z, 0, 0.8, 0.07, 0.32, 0.34, 0.3), 0.12);
      d = smin(d, ell(x, y, z, 0, 1.27, 0, 0.26, 0.18, 0.22), 0.1);
      d = smin(d, limb(ax, y, z, [0.15, 0.58, 0.02], [0.17, 0.16, 0.05], 0.17, 0.115), 0.1);
      for (let i = 0; i < 2; i++) {
        const s = i ? 1 : -1;
        if (x * s < -0.05) continue;
        const [fx, fy, fz] = footLocal[i](x, y, z);
        d = smin(d, ell(fx, fy, fz, 0, 0.08, 0.02, 0.13, 0.085, 0.25), 0.07);
        const [lx, ly, lz] = armLocal[i](x, y, z);
        let a = limb(lx, ly, lz, [0, 0.02, 0], [0, -0.38, 0.01], 0.095, 0.07);
        a = smin(a, ell(lx, ly, lz, 0, -0.46, 0.015, 0.085, 0.095, 0.065), 0.05);
        a = smin(a, ell(lx, ly, lz, -s * 0.055, -0.42, 0.05, 0.035, 0.05, 0.035), 0.03);
        d = smin(d, a, 0.06);
      }
      return d;
    };
    const body = new THREE.Mesh(meshSDF(bodySDF, [-0.66, -0.02, -0.45], [0.66, 1.52, 0.55], 0.014), mat.fur);
    body.castShadow = body.receiveShadow = true;
    bunny.add(body);
  }

  const tail = blob(mat.muzzle, [0, 0.66, -0.52], [0.13, 0.13, 0.13], bunny);

  // Head: round skull widening into full cheeks, a small snout, brow ridges, eye sockets, and a Y mouth.
  const head = new THREE.Group();
  // Real figures have a big head on a small body.
  head.position.set(0, 1.8, 0);
  head.scale.setScalar(1.15);
  bunny.add(head);
  const headParts = [];
  let EYE_Z = 0.42;
  {
    const skull = (x, y, z) => {
      const ax = Math.abs(x);
      let d = ell(x, y, z, 0, 0.03, -0.02, 0.47, 0.43, 0.45);
      d = smin(d, ell(ax, y, z, 0.17, -0.14, 0.15, 0.24, 0.2, 0.25), 0.12);
      d = smin(d, ell(x, y, z, 0, -0.1, 0.3, 0.2, 0.15, 0.19), 0.1);
      d = smin(d, ell(ax, y, z, 0.075, -0.16, 0.38, 0.095, 0.075, 0.075), 0.05);
      d = smin(d, ell(x, y, z, 0, -0.245, 0.32, 0.08, 0.05, 0.06), 0.04);
      return d;
    };
    // A downward-pointing triangle nose: wide on top, narrowing to a point.
    const NZ = surfaceZ(skull, 0, -0.07) - 0.014;
    const nose = (x, y, z) => smin(
      ell(x, y, z, 0, -0.06, NZ, 0.056, 0.026, 0.034),
      ell(x, y, z, 0, -0.088, NZ - 0.004, 0.022, 0.026, 0.03), 0.025);
    // Eyes sit in rounded mounds with a lid rim, like the sculpted figure.
    const EZ = surfaceZ(skull, 0.19, 0.03);
    const mound = (ax, y, z) => ell(ax, y, z, 0.19, 0.03, EZ - 0.05, 0.085, 0.085, 0.07);
    EYE_Z = EZ + 0.005;
    const socket = (ax, y, z) => ell(ax, y, z, 0.19, 0.03, EYE_Z, 0.074, 0.08, 0.05);
    // Y mouth: a short line down from the nose, then two arcs curling up into a smile.
    const mz = (p) => [...p, surfaceZ(skull, p[0], p[1])];
    const M0 = mz([0, -0.11]), M1 = mz([0, -0.15]), M2 = mz([0.04, -0.168]), M3 = mz([0.072, -0.152]);
    const mouth = (ax, y, z) => Math.min(
      limb(ax, y, z, M0, M1, 0.0075, 0.0075),
      limb(ax, y, z, M1, M2, 0.0075, 0.0075),
      limb(ax, y, z, M2, M3, 0.0075, 0.006));
    const headSDF = (x, y, z) => {
      const ax = Math.abs(x);
      let d = smin(skull(x, y, z), nose(x, y, z), 0.02);
      d = smin(d, mound(ax, y, z), 0.04);
      d = smax(d, -socket(ax, y, z), 0.012);
      d = smax(d, -mouth(ax, y, z), 0.006);
      return d;
    };
    const geo = meshSDF(headSDF, [-0.62, -0.5, -0.55], [0.62, 0.55, 0.62], 0.011);
    const P = geo.attributes.position.array;
    const muzzleMask = [], noseMask = [], mouthMask = [];
    for (let q = 0; q < P.length; q += 3) {
      const x = P[q], y = P[q + 1], z = P[q + 2], ax = Math.abs(x);
      muzzleMask.push(smooth01(0.02, -0.02, ell(x, y, z, 0, -0.17, 0.36, 0.215, 0.14, 0.2)) * smooth01(0.14, 0.24, z));
      noseMask.push(smooth01(0.012, 0.002, nose(x, y, z)));
      mouthMask.push(smooth01(0.02, 0.008, mouth(ax, y, z)));
    }
    geo.setAttribute("color", new THREE.Float32BufferAttribute(new Float32Array(P.length), 3));
    const mesh = new THREE.Mesh(geo, furMaterial());
    mesh.castShadow = mesh.receiveShadow = true;
    head.add(mesh);
    headParts.push({ geo, paint: (c, fur, muz, i) => {
      c.copy(fur).lerp(muz, muzzleMask[i]).lerp(mat.nose.color, noseMask[i]).lerp(mat.mouth.color, mouthMask[i] * 0.85);
    } });

    for (const s of [-1, 1]) {
      add(new THREE.SphereGeometry(0.052, 32, 20), mat.eye, head, [s * 0.19, 0.03, EYE_Z - 0.012]);
      add(new THREE.SphereGeometry(0.012, 12, 8), mat.glint, head, [s * 0.19 + 0.017, 0.052, EYE_Z + 0.033]);
    }
  }

  // Ears: broad spoon shapes with a cupped front, leaning back in a soft V. They pivot at the base to twitch.
  const ears = [-1, 1].map((s) => {
    const ear = new THREE.Group();
    ear.position.set(s * 0.18, 0.3, -0.08);
    ear.rotation.set(-0.2, 0, -s * 0.16);
    ear.scale.set(1, 1.18, 1);
    head.add(ear);
    return { group: ear, side: s, base: ear.rotation.z };
  });
  {
    const cup = (x, y, z) => ell(x, y, z, 0, 0.42, 0.075, 0.112, 0.29, 0.06);
    const earSDF = (x, y, z) => {
      let d = ell(x, y, z, 0, 0.36, 0, 0.155, 0.4, 0.075);
      d = smin(d, ell(x, y, z, 0, 0.47, 0, 0.175, 0.28, 0.07), 0.08);
      return smax(d, -cup(x, y, z), 0.03);
    };
    const geo = meshSDF(earSDF, [-0.22, -0.1, -0.12], [0.22, 0.82, 0.12], 0.008);
    const P = geo.attributes.position.array;
    const innerMask = [];
    for (let q = 0; q < P.length; q += 3) innerMask.push(smooth01(0.014, 0.002, cup(P[q] * 1.08, P[q + 1], P[q + 2])));
    geo.setAttribute("color", new THREE.Float32BufferAttribute(new Float32Array(P.length), 3));
    headParts.push({ geo, paint: (c, fur, muz, i) => { c.copy(fur).lerp(mat.earInner.color, innerMask[i]); } });
    for (const { group } of ears) {
      const mesh = new THREE.Mesh(geo, furMaterial());
      mesh.castShadow = mesh.receiveShadow = true;
      group.add(mesh);
    }
  }
  // Repaint the vertex-colored head and ears from the current fur and muzzle colors.
  function paintFur() {
    const c = new THREE.Color();
    for (const { geo, paint } of headParts) {
      const col = geo.attributes.color;
      for (let i = 0; i < col.count; i++) { paint(c, mat.fur.color, mat.muzzle.color, i); col.setXYZ(i, c.r, c.g, c.b); }
      col.needsUpdate = true;
    }
  }

  // ---------- Closet ----------
  // Every wearable piece is a group tagged with its slot and item id; dressing toggles visibility.
  const wardrobe = { outfit: {}, hat: {}, extra: {}, shoes: {} };
  const tailSpots = {};
  function piece(slot, id, parent = bunny) {
    const g = new THREE.Group();
    parent.add(g);
    (wardrobe[slot][id] ||= []).push(g);
    return g;
  }
  const bodice = (g, m) => blob(m, [0, 1.12, 0.02], [0.38, 0.36, 0.34], g);
  const puffSleeves = (g, m, size = 0.15) => {
    for (const s of [-1, 1]) blob(m, [s * 0.32, 1.2, 0], [size, size * 0.93, size], g);
  };
  const collar = (g, r = 0.2, tube = 0.06) =>
    add(torus(r, tube), mat.trim, g, [0, 1.4, 0], [PI / 2, 0, 0], [1, 1, 0.55]);

  // Apron dress
  {
    const SKIRT = [[0.30, 1.20], [0.33, 1.05], [0.40, 0.88], [0.49, 0.66], [0.56, 0.48], [0.59, 0.41], [0.57, 0.38]];
    const g = piece("outfit", "apron");
    add(lathe(SKIRT, 64), mat.dress, g);
    add(torus(0.575, 0.022), mat.trim, g, [0, 0.395, 0], [PI / 2, 0, 0]);
    const APRON = SKIRT.slice(1, 5).map(([r, y]) => [r + 0.014, y]);
    add(lathe(APRON, 32, -0.75, 1.5), mat.apron, g);
    bodice(g, mat.dress);
    puffSleeves(g, mat.dress);
    collar(g);
    tailSpots.apron = [0.66, -0.52];
  }

  // Party dress: fuller skirt, ruffled hem, sash with a bow at the back.
  {
    const SKIRT = [[0.30, 1.20], [0.34, 1.02], [0.44, 0.82], [0.56, 0.60], [0.64, 0.44], [0.66, 0.38], [0.63, 0.35]];
    const g = piece("outfit", "party");
    add(lathe(SKIRT, 64), mat.dress, g);
    add(torus(0.645, 0.04), mat.trim, g, [0, 0.365, 0], [PI / 2, 0, 0]);
    add(torus(0.345, 0.04), mat.ribbon, g, [0, 0.99, 0], [PI / 2, 0, 0]);
    for (const s of [-1, 1]) {
      blob(mat.ribbon, [s * 0.1, 0.99, -0.4], [0.11, 0.075, 0.04], g, [0, 0, s * 0.35]);
      blob(mat.ribbon, [s * 0.05, 0.86, -0.4], [0.035, 0.12, 0.02], g, [0, 0, s * 0.2]);
    }
    blob(mat.ribbon, [0, 0.99, -0.41], [0.045, 0.045, 0.04], g);
    bodice(g, mat.dress);
    puffSleeves(g, mat.dress, 0.16);
    collar(g, 0.21, 0.065);
    tailSpots.party = [0.66, -0.57];
  }

  // Overalls over a white shirt.
  {
    const g = piece("outfit", "overalls");
    bodice(g, mat.trim);
    puffSleeves(g, mat.trim, 0.14);
    collar(g, 0.2, 0.05);
    blob(mat.dress, [0, 0.78, 0.04], [0.4, 0.38, 0.37], g);
    for (const s of [-1, 1]) {
      blob(mat.dress, [s * 0.16, 0.4, 0.03], [0.2, 0.3, 0.2], g);
      add(torus(0.135, 0.03), mat.dress, g, [s * 0.17, 0.16, 0.05], [PI / 2, 0, 0]);
      add(box(0.06, 0.2, 0.03), mat.dress, g, [s * 0.1, 1.28, 0.25], [-0.55, 0, 0]);
      add(new THREE.SphereGeometry(0.026, 16, 12), mat.button, g, [s * 0.1, 1.2, 0.315]);
    }
    add(box(0.3, 0.28, 0.05), mat.dress, g, [0, 1.07, 0.29]);
    add(box(0.12, 0.08, 0.012), mat.apron, g, [0, 1.04, 0.318]);
    tailSpots.overalls = [0.74, -0.34];
  }

  // Nightgown: floor-length with long sleeves and a ruffled collar.
  {
    const SKIRT = [[0.30, 1.20], [0.34, 1.00], [0.42, 0.78], [0.50, 0.55], [0.56, 0.34], [0.60, 0.24], [0.58, 0.22]];
    const g = piece("outfit", "nightgown");
    add(lathe(SKIRT, 64), mat.dress, g);
    add(torus(0.59, 0.035), mat.trim, g, [0, 0.235, 0], [PI / 2, 0, 0]);
    bodice(g, mat.dress);
    puffSleeves(g, mat.dress, 0.14);
    collar(g, 0.22, 0.07);
    blob(mat.ribbon, [0, 1.33, 0.29], [0.06, 0.035, 0.025], g);
    for (const arm of arms) {
      const sleeve = piece("outfit", "nightgown", arm);
      blob(mat.dress, [0, -0.2, 0], [0.125, 0.23, 0.125], sleeve);
      add(torus(0.1, 0.025), mat.trim, sleeve, [0, -0.4, 0], [PI / 2, 0, 0]);
    }
    tailSpots.nightgown = [0.66, -0.5];
  }

  // Just fur: the bare figure.
  tailSpots.none = [0.72, -0.34];

  // Hats live on the head (local coords: skull radii 0.47 × 0.43 × 0.45). Ears poke through, like the real toys.
  {
    const g = piece("hat", "straw", head);
    g.rotation.set(-0.08, 0, 0.08);
    add(new THREE.CylinderGeometry(0.55, 0.55, 0.025, 64), mat.straw, g, [0, 0.3, 0]);
    add(new THREE.CylinderGeometry(0.27, 0.3, 0.2, 48), mat.straw, g, [0, 0.41, 0]);
    add(new THREE.CylinderGeometry(0.297, 0.306, 0.055, 48), mat.ribbon, g, [0, 0.34, 0]);
  }
  {
    const g = piece("hat", "bow", head);
    for (const s of [-1, 1]) blob(mat.ribbon, [0.2 + s * 0.09, 0.36, 0.15], [0.09, 0.06, 0.035], g, [-0.5, 0, s * 0.3]);
    blob(mat.ribbon, [0.2, 0.36, 0.165], [0.04, 0.04, 0.035], g);
  }
  {
    const g = piece("hat", "flowers", head);
    g.rotation.x = 0.12;
    add(torus(0.39, 0.022), mat.leaf, g, [0, 0.25, 0], [PI / 2, 0, 0], [1.07, 1, 1]);
    const petals = [mat.petalPink, mat.petalWhite, mat.petalLilac];
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * PI * 2;
      const x = Math.cos(a) * 0.42, z = Math.sin(a) * 0.39;
      blob(petals[i % 3], [x, 0.26, z], [0.05, 0.04, 0.05], g);
      blob(mat.button, [x * 1.04, 0.28, z * 1.04], [0.019, 0.019, 0.019], g);
      blob(mat.leaf, [Math.cos(a + 0.22) * 0.43, 0.24, Math.sin(a + 0.22) * 0.4], [0.035, 0.013, 0.022], g, [0, -a, 0]);
    }
  }
  {
    const g = piece("hat", "beret", head);
    blob(mat.beret, [-0.06, 0.38, -0.02], [0.42, 0.11, 0.4], g, [0.05, 0, 0.22]);
    add(new THREE.CylinderGeometry(0.018, 0.022, 0.06, 12), mat.beret, g, [-0.09, 0.5, -0.02], [0, 0, 0.22]);
  }

  // Extras
  {
    const g = piece("extra", "scarf");
    add(torus(0.23, 0.075), mat.knit, g, [0, 1.4, 0], [PI / 2, 0, 0], [1, 1, 0.6]);
    blob(mat.knit, [0.13, 1.21, 0.28], [0.075, 0.17, 0.04], g, [0.25, 0, -0.18]);
    blob(mat.knit, [0.05, 1.24, 0.29], [0.07, 0.15, 0.04], g, [0.25, 0, 0.12]);
  }
  {
    const g = piece("extra", "bag");
    const strap = new THREE.Group();
    strap.position.set(0, 1.05, 0);
    strap.rotation.z = 0.55;
    g.add(strap);
    add(torus(0.4, 0.016), mat.bag, strap, [0, 0, 0], [0, PI / 2, 0]);
    const purse = new THREE.Group();
    purse.position.set(0.37, 0.72, 0.34);
    purse.rotation.y = 0.75;
    g.add(purse);
    add(box(0.22, 0.17, 0.08), mat.bag, purse);
    add(box(0.225, 0.07, 0.085), mat.bagFlap, purse, [0, 0.055, 0.003]);
    add(new THREE.SphereGeometry(0.018, 12, 8), mat.button, purse, [0, 0.02, 0.05]);
  }
  {
    const g = piece("extra", "glasses", head);
    for (const s of [-1, 1]) {
      add(torus(0.085, 0.012), mat.frame, g, [s * 0.19, 0.03, EYE_Z + 0.075]);
      add(new THREE.CircleGeometry(0.085, 32), mat.lens, g, [s * 0.19, 0.03, EYE_Z + 0.073]);
      add(box(0.018, 0.018, 0.32), mat.frame, g, [s * 0.31, 0.045, EYE_Z - 0.08], [0, s * -0.6, 0]);
    }
    add(new THREE.CylinderGeometry(0.011, 0.011, 0.2, 8), mat.frame, g, [0, 0.06, EYE_Z + 0.08], [0, 0, PI / 2]);
  }

  // Shoes
  [-1, 1].forEach((s, i) => {
    const mj = piece("shoes", "maryjanes", feet[i]);
    blob(mat.patent, [0, 0.08, 0.02], [0.148, 0.1, 0.27], mj);
    blob(mat.ribbon, [0, 0.16, 0.17], [0.04, 0.025, 0.02], mj);

    const boot = piece("shoes", "boots");
    blob(mat.boot, [0, 0.08, 0.02], [0.148, 0.1, 0.27], piece("shoes", "boots", feet[i]));
    add(new THREE.CylinderGeometry(0.19, 0.18, 0.32, 32), mat.boot, boot, [s * 0.16, 0.3, 0]);
    add(torus(0.19, 0.022), mat.boot, boot, [s * 0.16, 0.46, 0], [PI / 2, 0, 0]);
  });

  // ---------- State ----------
  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
      return { ...DEFAULTS, ...saved };
    } catch { return { ...DEFAULTS }; }
  }
  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {}
  }
  const state = loadState();
  const setColor = (m, hex) => m.color.setHex(hex).convertSRGBToLinear();

  function dress() {
    const fur = FURS.find((f) => f.id === state.fur) || FURS[0];
    setColor(mat.fur, fur.fur);
    setColor(mat.muzzle, fur.muzzle);
    const sheen = mat.fur.color.clone().lerp(new THREE.Color(1, 1, 1), 0.3);
    furMats.forEach((m) => { m.sheen.copy(sheen); });
    paintFur();
    setColor(mat.dress, (COLORS.find((c) => c.id === state.color) || COLORS[0]).color);
    for (const [slot, items] of Object.entries(wardrobe)) {
      for (const [id, groups] of Object.entries(items)) groups.forEach((g) => { g.visible = state[slot] === id; });
    }
    const [ty, tz] = tailSpots[state.outfit] || tailSpots.apron;
    tail.position.set(0, ty, tz);
    syncUI();
    saveState();
  }

  // ---------- UI ----------
  const hex = (n) => "#" + n.toString(16).padStart(6, "0");
  function swatches(el, list, colorOf, key) {
    for (const item of list) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "swatch";
      b.id = `${key}-${item.id}`;
      b.dataset.value = item.id;
      b.style.setProperty("--c", hex(colorOf(item)));
      b.setAttribute("aria-label", item.name);
      b.title = item.name;
      b.addEventListener("click", () => { state[key] = item.id; dress(); });
      el.appendChild(b);
    }
  }
  swatches(document.getElementById("fur"), FURS, (f) => f.fur, "fur");
  swatches(document.getElementById("color"), COLORS, (c) => c.color, "color");

  const tabsEl = document.getElementById("tabs");
  const itemsEl = document.getElementById("items");
  let activeTab = CLOSET[0].slot;

  for (const cat of CLOSET) {
    const t = document.createElement("button");
    t.type = "button";
    t.className = "tab";
    t.id = `tab-${cat.slot}`;
    t.setAttribute("role", "tab");
    t.textContent = cat.tab;
    t.addEventListener("click", () => { activeTab = cat.slot; renderItems(); syncUI(); });
    tabsEl.appendChild(t);
  }
  tabsEl.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const i = CLOSET.findIndex((c) => c.slot === activeTab);
    const next = CLOSET[(i + (e.key === "ArrowRight" ? 1 : CLOSET.length - 1)) % CLOSET.length];
    activeTab = next.slot;
    renderItems();
    syncUI();
    document.getElementById(`tab-${next.slot}`).focus();
  });

  function renderItems() {
    const cat = CLOSET.find((c) => c.slot === activeTab);
    itemsEl.setAttribute("aria-labelledby", `tab-${cat.slot}`);
    itemsEl.replaceChildren(...cat.items.map((item) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.id = `item-${cat.slot}-${item.id}`;
      b.dataset.value = item.id;
      b.textContent = item.name;
      b.addEventListener("click", () => { state[cat.slot] = item.id; dress(); });
      return b;
    }));
  }

  function syncUI() {
    document.querySelectorAll("#fur .swatch").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === state.fur)));
    document.querySelectorAll("#color .swatch").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === state.color)));
    tabsEl.querySelectorAll(".tab").forEach((t) => {
      const on = t.id === `tab-${activeTab}`;
      t.setAttribute("aria-selected", String(on));
      t.tabIndex = on ? 0 : -1;
    });
    itemsEl.querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === state[activeTab])));
  }

  const pick = (list) => list[Math.floor(Math.random() * list.length)];
  document.getElementById("surprise").addEventListener("click", () => {
    for (const cat of CLOSET) state[cat.slot] = pick(cat.items).id;
    state.color = pick(COLORS).id;
    dress();
  });

  const spinBtn = document.getElementById("spin");
  spinBtn.setAttribute("aria-pressed", String(controls.autoRotate));
  spinBtn.addEventListener("click", () => {
    controls.autoRotate = !controls.autoRotate;
    spinBtn.setAttribute("aria-pressed", String(controls.autoRotate));
  });
  document.getElementById("reset").addEventListener("click", () => {
    camera.position.copy(HOME);
    controls.target.copy(TARGET);
    controls.update();
  });

  renderItems();
  dress();

  // ---------- Resize: keep the bunny clear of the card ----------
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    renderer.domElement.style.width = w + "px";
    renderer.domElement.style.height = h + "px";
    camera.aspect = w / h;
    const narrow = w <= 560;
    camera.zoom = narrow ? Math.min(1, (w / h) * 1.6) : Math.min(1, (w / h) * 1.15);
    // Shift the picture away from the card: right on desktop, up on phones.
    if (narrow) camera.setViewOffset(w, h, 0, h * 0.2, w, h);
    else if (w > 900) camera.setViewOffset(w, h, -160, 0, w, h);
    else camera.clearViewOffset();
    camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize);
  resize();

  // ---------- Idle life: gentle breathing, a head tilt, an occasional ear twitch ----------
  const clock = new THREE.Clock();
  let nextTwitch = 2;
  let twitch = null;
  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    if (!reduceMotion) {
      bunny.scale.y = 1 + Math.sin(t * 2) * 0.006;
      head.rotation.z = Math.sin(t * 0.7) * 0.04;
      head.rotation.x = Math.sin(t * 0.5) * 0.03;
      if (t > nextTwitch && !twitch) {
        twitch = { ear: pick(ears), start: t };
        nextTwitch = t + 2.5 + Math.random() * 3;
      }
      if (twitch) {
        const p = Math.min((t - twitch.start) / 0.45, 1);
        const { group, side, base } = twitch.ear;
        group.rotation.z = base - side * Math.sin(p * PI * 2) * 0.18 * (1 - p);
        if (p >= 1) twitch = null;
      }
    }
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
