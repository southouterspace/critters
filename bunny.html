<title>Clover the Bunny</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
  /* Layout: full-bleed 3D stage, one small floating control card (top-left on desktop, bottom on phones). */
  :root {
    --bg: #e4ece2;
    --bg-glow: #f6f8f1;
    --fg: #2f3a2f;
    --muted: #66735f;
    --card: rgba(255, 255, 255, 0.78);
    --line: rgba(47, 58, 47, 0.14);
    --accent: #c4566c;
    --ring: #2f3a2f;
    --font-display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
    --font-body: "Nunito", ui-rounded, system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b231d; --bg-glow: #2b3a2e; --fg: #eef3ea; --muted: #a6b4a0;
      --card: rgba(30, 40, 32, 0.8); --line: rgba(238, 243, 234, 0.14);
      --accent: #ec8fa1; --ring: #eef3ea; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b231d; --bg-glow: #2b3a2e; --fg: #eef3ea; --muted: #a6b4a0;
    --card: rgba(30, 40, 32, 0.8); --line: rgba(238, 243, 234, 0.14);
    --accent: #ec8fa1; --ring: #eef3ea; color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 40%, var(--bg-glow), var(--bg) 70%);
    background-color: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  #stage canvas { display: block; outline: none; }

  .card {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    width: min(280px, calc(100vw - 32px));
    display: grid;
    gap: 14px;
    padding: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.75rem;
    line-height: 1.1;
    text-wrap: balance;
  }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 0.875rem; }
  .group { display: grid; gap: 8px; }
  .label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch {
    width: 30px; height: 30px; padding: 0;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: var(--c);
    cursor: pointer;
    transition: transform 120ms ease;
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch[aria-pressed="true"] { border-color: var(--ring); box-shadow: 0 0 0 2px var(--bg-glow) inset; }
  .actions { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    font: 600 0.875rem/1 var(--font-body);
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 12px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--fg); }
  .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 560px) {
    .card {
      top: auto;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      left: max(16px, env(safe-area-inset-left, 0px));
      right: max(16px, env(safe-area-inset-right, 0px));
      width: auto;
      grid-template-columns: 1fr 1fr;
      padding: 14px;
      gap: 12px;
    }
    .card header, .card .actions { grid-column: 1 / -1; }
    h1 { font-size: 1.35rem; }
  }
</style>

<div id="stage" aria-label="3D bunny figure. Drag to rotate, scroll or pinch to zoom."></div>

<aside class="card">
  <header>
    <h1>Clover the Bunny</h1>
    <p class="sub">Drag to turn her around. Scroll or pinch to zoom.</p>
  </header>
  <div class="group">
    <span class="label">Fur</span>
    <div class="swatches" id="fur"></div>
  </div>
  <div class="group">
    <span class="label">Dress</span>
    <div class="swatches" id="dress"></div>
  </div>
  <div class="actions">
    <button class="btn" id="spin" type="button" aria-pressed="true">Spin</button>
    <button class="btn" id="reset" type="button">Reset view</button>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  const FURS = [
    { name: "Chocolate", fur: 0x8a5a3b, muzzle: 0xf2e4d2 },
    { name: "Caramel",   fur: 0xd8b07e, muzzle: 0xfbf1e2 },
    { name: "Snow",      fur: 0xf1ede6, muzzle: 0xfffcf6 },
    { name: "Grey",      fur: 0x9a9893, muzzle: 0xf0eee9 },
  ];
  const DRESSES = [
    { name: "Rose",  color: 0xd9667b },
    { name: "Sky",   color: 0x6f9bd1 },
    { name: "Sage",  color: 0x86a568 },
    { name: "Plum",  color: 0x8c5f98 },
  ];
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const stage = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  const HOME = new THREE.Vector3(2.6, 2.3, 7.2);
  const TARGET = new THREE.Vector3(0, 1.5, 0);
  camera.position.copy(HOME);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.copy(TARGET);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 2.6;
  controls.maxDistance = 11;
  controls.autoRotate = !reduceMotion;
  controls.autoRotateSpeed = 1.6;
  controls.update();

  // Soft studio lighting: warm key with shadows, cool fill, rim from behind.
  scene.add(new THREE.HemisphereLight(0xfff8ee, 0x8a9a80, 0.75));
  const key = new THREE.DirectionalLight(0xfff1df, 1.05);
  key.position.set(3, 6, 4);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.radius = 6;
  Object.assign(key.shadow.camera, { left: -2, right: 2, top: 3.5, bottom: -1, near: 1, far: 15 });
  key.shadow.bias = -0.0005;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xdfe9ff, 0.35);
  fill.position.set(-4, 2, 2);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 0.45);
  rim.position.set(-1, 3, -5);
  scene.add(rim);

  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(4, 64),
    new THREE.ShadowMaterial({ opacity: 0.18 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Fine noise as a bump map gives the matte, flocked look of the real figures.
  function flockTexture() {
    const c = document.createElement("canvas");
    c.width = c.height = 256;
    const g = c.getContext("2d");
    const img = g.createImageData(256, 256);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 110 + Math.random() * 145;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(6, 6);
    return t;
  }
  const flock = flockTexture();
  const felt = (color) => new THREE.MeshStandardMaterial({
    color, roughness: 1, metalness: 0, bumpMap: flock, bumpScale: 0.006,
  });

  const mat = {
    fur: felt(FURS[0].fur),
    muzzle: felt(FURS[0].muzzle),
    earInner: felt(0xf0a9b4),
    nose: new THREE.MeshStandardMaterial({ color: 0xe0788c, roughness: 0.45 }),
    eye: new THREE.MeshStandardMaterial({ color: 0x120c0a, roughness: 0.12, metalness: 0.1 }),
    glint: new THREE.MeshBasicMaterial({ color: 0xffffff }),
    dress: new THREE.MeshStandardMaterial({ color: DRESSES[0].color, roughness: 0.85, side: THREE.DoubleSide }),
    apron: new THREE.MeshStandardMaterial({ color: 0xf1e9dc, roughness: 0.95, side: THREE.DoubleSide }),
    trim: new THREE.MeshStandardMaterial({ color: 0xfbf7f0, roughness: 0.9 }),
  };
  [mat.fur, mat.muzzle, mat.earInner, mat.nose, mat.dress, mat.apron, mat.trim].forEach((m) => m.color.convertSRGBToLinear());

  const sphere = new THREE.SphereGeometry(1, 48, 32);
  function blob(material, [x, y, z], [sx, sy, sz], parent = bunny) {
    const m = new THREE.Mesh(sphere, material);
    m.position.set(x, y, z);
    m.scale.set(sx, sy, sz);
    m.castShadow = true;
    m.receiveShadow = true;
    parent.add(m);
    return m;
  }

  const bunny = new THREE.Group();
  scene.add(bunny);

  // Feet and legs
  for (const s of [-1, 1]) {
    blob(mat.fur, [s * 0.17, 0.1, 0.1], [0.17, 0.11, 0.25]);
    blob(mat.fur, [s * 0.16, 0.3, 0], [0.16, 0.26, 0.16]);
  }

  // Skirt: a lathed bell flaring out to the hem.
  const skirtProfile = [
    [0.30, 1.20], [0.33, 1.05], [0.40, 0.88], [0.49, 0.66], [0.56, 0.48], [0.59, 0.41], [0.57, 0.38],
  ].map(([r, y]) => new THREE.Vector2(r, y));
  const skirt = new THREE.Mesh(new THREE.LatheGeometry(skirtProfile, 64), mat.dress);
  skirt.castShadow = skirt.receiveShadow = true;
  bunny.add(skirt);

  // Hem trim
  const hem = new THREE.Mesh(new THREE.TorusGeometry(0.575, 0.022, 12, 80), mat.trim);
  hem.rotation.x = Math.PI / 2;
  hem.position.y = 0.395;
  hem.castShadow = true;
  bunny.add(hem);

  // Apron: the front slice of a slightly larger lathe, so it sits on the skirt.
  const apronProfile = skirtProfile.slice(1, 5).map((v) => new THREE.Vector2(v.x + 0.014, v.y));
  const apron = new THREE.Mesh(new THREE.LatheGeometry(apronProfile, 32, -0.75, 1.5), mat.apron);
  apron.castShadow = true;
  bunny.add(apron);

  // Bodice, puffed sleeves and collar
  blob(mat.dress, [0, 1.13, 0], [0.35, 0.34, 0.31]);
  for (const s of [-1, 1]) blob(mat.dress, [s * 0.32, 1.2, 0], [0.15, 0.14, 0.15]);
  const collar = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.06, 16, 48), mat.trim);
  collar.rotation.x = Math.PI / 2;
  collar.scale.set(1, 1, 0.55);
  collar.position.y = 1.4;
  collar.castShadow = true;
  bunny.add(collar);

  // Arms hang slightly forward and out, ending in round paws.
  for (const s of [-1, 1]) {
    const arm = new THREE.Group();
    arm.position.set(s * 0.33, 1.2, 0.02);
    arm.rotation.z = s * 0.32;
    arm.rotation.x = -0.18;
    bunny.add(arm);
    blob(mat.fur, [0, -0.25, 0], [0.1, 0.26, 0.1], arm);
    blob(mat.fur, [0, -0.47, 0.01], [0.11, 0.1, 0.1], arm);
  }

  // Tail
  blob(mat.muzzle, [0, 0.66, -0.52], [0.13, 0.13, 0.13]);

  // Head
  const head = new THREE.Group();
  head.position.set(0, 1.78, 0);
  bunny.add(head);
  blob(mat.fur, [0, 0, 0], [0.61, 0.54, 0.56], head);
  blob(mat.muzzle, [0, -0.13, 0.43], [0.27, 0.18, 0.18], head);
  for (const s of [-1, 1]) blob(mat.muzzle, [s * 0.11, -0.16, 0.44], [0.15, 0.13, 0.14], head);
  blob(mat.nose, [0, -0.04, 0.605], [0.055, 0.04, 0.035], head);

  for (const s of [-1, 1]) {
    blob(mat.eye, [s * 0.21, 0.07, 0.49], [0.065, 0.07, 0.04], head);
    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.016, 12, 8), mat.glint);
    glint.position.set(s * 0.21 + 0.022, 0.1, 0.527);
    head.add(glint);
  }

  // Ears pivot at their base so they can twitch.
  const ears = [];
  for (const s of [-1, 1]) {
    const ear = new THREE.Group();
    ear.position.set(s * 0.19, 0.4, -0.06);
    ear.rotation.set(-0.12, 0, -s * 0.14);
    head.add(ear);
    blob(mat.fur, [0, 0.42, 0], [0.15, 0.48, 0.075], ear);
    blob(mat.earInner, [0, 0.4, 0.048], [0.085, 0.36, 0.035], ear);
    ears.push({ group: ear, side: s, base: ear.rotation.z });
  }

  // Swatches
  function buildSwatches(el, items, colorOf, onPick) {
    items.forEach((item, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "swatch";
      b.id = `${el.id}-${item.name.toLowerCase()}`;
      b.style.setProperty("--c", "#" + colorOf(item).toString(16).padStart(6, "0"));
      b.setAttribute("aria-label", item.name);
      b.title = item.name;
      b.setAttribute("aria-pressed", String(i === 0));
      b.addEventListener("click", () => {
        el.querySelectorAll(".swatch").forEach((s) => s.setAttribute("aria-pressed", String(s === b)));
        onPick(item);
      });
      el.appendChild(b);
    });
  }
  const setColor = (m, hex) => m.color.setHex(hex).convertSRGBToLinear();
  buildSwatches(document.getElementById("fur"), FURS, (f) => f.fur, (f) => {
    setColor(mat.fur, f.fur);
    setColor(mat.muzzle, f.muzzle);
  });
  buildSwatches(document.getElementById("dress"), DRESSES, (d) => d.color, (d) => setColor(mat.dress, d.color));

  const spinBtn = document.getElementById("spin");
  spinBtn.setAttribute("aria-pressed", String(controls.autoRotate));
  spinBtn.addEventListener("click", () => {
    controls.autoRotate = !controls.autoRotate;
    spinBtn.setAttribute("aria-pressed", String(controls.autoRotate));
  });
  document.getElementById("reset").addEventListener("click", () => {
    camera.position.copy(HOME);
    controls.target.copy(TARGET);
    controls.update();
  });

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    renderer.domElement.style.width = w + "px";
    renderer.domElement.style.height = h + "px";
    camera.aspect = w / h;
    // Pull back on narrow screens so the whole figure stays in frame.
    camera.zoom = Math.min(1, (w / h) * 1.15);
    camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize);
  resize();

  // Idle life: gentle breathing, a head tilt, and an occasional ear twitch.
  const clock = new THREE.Clock();
  let nextTwitch = 2;
  let twitch = null;
  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    if (!reduceMotion) {
      bunny.scale.y = 1 + Math.sin(t * 2) * 0.006;
      head.rotation.z = Math.sin(t * 0.7) * 0.04;
      head.rotation.x = Math.sin(t * 0.5) * 0.03;
      if (t > nextTwitch && !twitch) {
        twitch = { ear: ears[Math.random() < 0.5 ? 0 : 1], start: t };
        nextTwitch = t + 2.5 + Math.random() * 3;
      }
      if (twitch) {
        const p = (t - twitch.start) / 0.45;
        const { group, side, base } = twitch.ear;
        group.rotation.z = base - side * Math.sin(Math.min(p, 1) * Math.PI * 2) * 0.18 * (1 - Math.min(p, 1));
        if (p >= 1) { group.rotation.z = base; twitch = null; }
      }
    }
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
